# server.conf.yaml — ACE 13 Integration Server configuration
# Purpose: Configure the MQ TLS trust store so ACE can connect to IBM MQ
#          over a one-way TLS connection using a self-signed certificate.
#
# One-way TLS (server authenticates to client only):
#   - No client certificate / private key required (no mutual auth)
#   - Only a trust store containing the queue manager self-signed cert is needed
#
# Trust store files are generated by:
#   scripts/download-qm-truststore.sh -n <namespace> -q <qmgr-cr> -w <work-dir>
#
# The script writes files to <work-dir>/config/mqssl/:
#   trust.kdb / trust.sth  — GSKit key database (MQ Client TLS)
#   trust.jks              — JVM trust store (Java-layer TLS)
#
# Default work directory assumed here: ~/TEST_SERVER
# Adjust the paths below if you use a different work directory.
# ---------------------------------------------------------------------------

BrokerRegistry:
  # ---------------------------------------------------------------------------
  # GSKit key repository for MQ Client TLS
  #
  # On OpenShift (ACE Operator) each GSKit file is a separate 'keystore'
  # Configuration CR.  The operator places them under /home/aceuser/keystores/.
  # Path is WITHOUT the .kdb extension — GSKit adds it automatically.
  # ---------------------------------------------------------------------------
  mqKeyRepository: /home/aceuser/keystores/trust

# ResourceManagers:
#  JVM:
    # -------------------------------------------------------------------------
    # JVM trust store (JKS) — Java-layer TLS
    #
    # On OpenShift (ACE Operator) this is a 'truststore' Configuration CR.
    # The operator places it under /home/aceuser/truststores/.
    # truststorePass is set via a 'setdbparms' Configuration CR.
    # -------------------------------------------------------------------------
#    truststoreFile: /home/aceuser/truststores/trust.jks
#    truststoreType: JKS
#    truststorePass: brokerTruststore::truststorePass

  HTTPConnector:
    # -------------------------------------------------------------------------
    # ACE HTTP application listener (inbound REST API traffic)
    # Default port 7800 — no TLS on the inbound REST side in this demo
    # -------------------------------------------------------------------------
    ListenerPort: 7800
